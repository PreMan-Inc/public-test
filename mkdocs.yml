docs_dir: docs
nav:
- Home: index.md
- API reference:
  - authentication: api/authentication.md
  - default: api/default.md
  - mock: api/mock.md
  - mock_customers: api/mock-customers.md
  - mock_docs: api/mock-docs.md
  - mock_openapi_json: api/mock-openapi-json.md
  - mock_orders: api/mock-orders.md
  - mock_products: api/mock-products.md
  - mock_reviews: api/mock-reviews.md
  - mock_schemas_json: api/mock-schemas-json.md
  - mock_tickets: api/mock-tickets.md
  - preman_probe: api/preman-probe.md
  - projects: api/projects.md
  - ready: api/ready.md
  - system: api/system.md
  - tasks: api/tasks.md
  - test_ui: api/test-ui.md
- SDKs:
  - Python: sdk/python.md
- Changelog: changelog.md
