# Site identity, theme and Markdown extensions.
#
# PreMan emits this file as a default so a fresh repository builds, and
# rewrites it on every release unless you add mkdocs.base.yml to
# .fernignore — which is how you take ownership of your branding.
#
# The nav and the page set live in mkdocs.yml and are always generated.
site_name: greptile-codex-backend
site_description: API reference and generated client libraries, kept in step with
  the live contract.
theme:
  name: material
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  - toc.follow
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
